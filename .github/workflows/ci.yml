name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: invoice_admin
          POSTGRES_PASSWORD: invoice_dev_only
          POSTGRES_DB: invoice_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U invoice_admin -d invoice_dev"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://invoice_app:invoice_local_only@127.0.0.1:5432/invoice_dev
      MIGRATION_DATABASE_URL: postgresql://invoice_admin:invoice_dev_only@127.0.0.1:5432/invoice_dev
      TEST_DATABASE_URL: postgresql://invoice_admin:invoice_dev_only@127.0.0.1:5432/invoice_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup
      - name: Provision local-only test role
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/local-init.sql
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: npm run check:mobile
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
